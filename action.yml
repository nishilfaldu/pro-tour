name: Pro Tour
description: Record a captioned feature tour of a pull request with Playwright and post it to the PR.
branding:
  icon: video
  color: blue

inputs:
  url:
    description: URL of the app, already running in an earlier step.
    required: true
  tour:
    description: Tour file. Defaults to .tours/<branch>.tour.js.
    required: false
  base:
    description: Base ref for the diff. Defaults to origin/<PR base branch>; check out with fetch-depth 0.
    required: false
  src:
    description: App source directory the planner reads. Defaults to the repository root.
    required: false
  model:
    description: Codex model that plans and repairs tours.
    default: gpt-6-sol
  effort:
    description: Model reasoning effort.
    default: high
  rounds:
    description: Repair attempts after the first try.
    default: '3'
  publish:
    description: Comment on the PR with the video and behavior checklist.
    default: 'true'
  working-directory:
    description: Directory of the app repository.
    default: .

outputs:
  status:
    description: passed or failed.
    value: ${{ steps.tour.outputs.status }}
  video:
    description: Path of the recorded MP4.
    value: ${{ steps.tour.outputs.video }}

runs:
  using: composite
  steps:
    - name: Install Pro Tour
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        command -v pnpm >/dev/null || npm install --global pnpm@11
        pnpm install --frozen-lockfile --prod
        pnpm exec playwright install --with-deps chromium
        command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ffmpeg; }

    - name: Install and log in to Codex
      shell: bash
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "OPENAI_API_KEY is not set: saved tours replay, but new or broken tours cannot be planned or repaired."
          exit 0
        fi
        # A global pnpm install needs PNPM_HOME, which runners do not set up; npm's global prefix works as is.
        npm install --global @openai/codex
        printenv OPENAI_API_KEY | codex login --with-api-key

    - name: Record the tour
      id: tour
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOUR: ${{ inputs.tour }}
        BASE: ${{ inputs.base }}
        SRC: ${{ inputs.src }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        args=(tour --url "${{ inputs.url }}" --model "${{ inputs.model }}" --effort "${{ inputs.effort }}" --rounds "${{ inputs.rounds }}" --log .videos/pro-tour-agent.json)
        [ -n "$TOUR" ] && args+=(--tour "$TOUR")
        [ -n "$BASE" ] && args+=(--base "$BASE")
        [ -n "$SRC" ] && args+=(--src "$SRC")
        [ "$PUBLISH" = true ] && args+=(--publish)
        set +e
        node "${{ github.action_path }}/bin/pro-tour.js" "${args[@]}"
        code=$?
        set -e
        node -e '
          const log = require(require("path").resolve(".videos/pro-tour-agent.json"));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${log.status}\nvideo=${log.video ?? ""}\n`);
          const wrote = log.history.some(item => item.kind !== "replay" && item.status === "passed");
          const summary = [`### Pro Tour: ${log.status}`, "",
            `${log.modelCalls} model calls, ${log.repairs} repairs, ${log.seconds}s.`,
            wrote ? `The tour was written or repaired in CI. Download the pro-tour artifact and commit \`${require("path").relative(process.cwd(), log.tour)}\` so the next run replays it without a model.` : ""];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
        ' || true
        exit $code

    - name: Upload the video, report and tour
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pro-tour
        path: |
          ${{ inputs.working-directory }}/.videos/
          ${{ inputs.working-directory }}/.tours/
        if-no-files-found: ignore
