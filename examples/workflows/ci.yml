name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  # Dogfood the action on the sample app: replay its saved tour (no model needed).
  # Add the pro-tour:publish label to a PR to also post the video to it.
  tour:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Start the sample app
        run: |
          node sample-app/server.js &
          for i in $(seq 30); do curl -fs http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done; exit 1
      - uses: ./
        with:
          url: http://127.0.0.1:4173
          tour: sample-app/.tours/status-filter.tour.js
          publish: ${{ contains(github.event.pull_request.labels.*.name, 'pro-tour:publish') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
