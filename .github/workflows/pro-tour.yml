name: Pro Tour
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Install trusted JavaScript dependencies
        run: npm ci
      - name: Classify PR files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files" | jq '[.[][] | .filename]' | node scripts/classify-pr.js >> "$GITHUB_OUTPUT"
      - name: Check out PR revision without credentials
        if: steps.classify.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          persist-credentials: false
      - name: Start PR app in isolated container
        if: steps.classify.outputs.run == 'true'
        id: app
        env:
          PR_DIRECTORY: ${{ github.workspace }}/pr-source
        run: |
          node scripts/app-container.js "$PR_DIRECTORY" > "$RUNNER_TEMP/pro-tour-app.json"
          jq -r '"container_id=" + .id' "$RUNNER_TEMP/pro-tour-app.json" >> "$GITHUB_OUTPUT"
          jq -r '"url=" + .url' "$RUNNER_TEMP/pro-tour-app.json" >> "$GITHUB_OUTPUT"
      - name: Report preflight
        if: steps.classify.outputs.run == 'true'
        env:
          APP_URL: ${{ steps.app.outputs.url }}
        run: printf 'PR app ready at %s\n' "$APP_URL"
      - name: Set up Python and upstream Jev
        if: steps.classify.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Install pinned upstream Jev
        if: steps.classify.outputs.run == 'true'
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python 'git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46'
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Install video encoder
        if: steps.classify.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb
          ffmpeg -version | head -1
      - name: Start app-only browser proxy and credential-free Chrome
        if: steps.classify.outputs.run == 'true'
        env:
          APP_URL: ${{ steps.app.outputs.url }}
        run: |
          node scripts/app-only-proxy.js > "$RUNNER_TEMP/pro-tour-proxy.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --proxy http://127.0.0.1:9224 --noproxy '' --output /dev/null "$APP_URL"; then break; fi
            sleep 1
          done
          curl --fail --silent --proxy http://127.0.0.1:9224 --noproxy '' --output /dev/null "$APP_URL"
          sudo useradd --system --no-create-home pro-tour-browser
          BROWSER_UID=$(id -u pro-tour-browser)
          CHROME_HOME="/tmp/pro-tour-chrome-$GITHUB_RUN_ID"
          sudo install -d -o pro-tour-browser -g pro-tour-browser "$CHROME_HOME"
          # Chrome may connect only to the validating proxy. Unix display sockets are unaffected.
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$BROWSER_UID" -j REJECT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$BROWSER_UID" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$BROWSER_UID" -p tcp -d 127.0.0.1 --dport 9224 -j ACCEPT
          Xvfb :99 -screen 0 1280x800x24 > "$RUNNER_TEMP/pro-tour-xvfb.log" 2>&1 &
          sudo -u pro-tour-browser env -i HOME="$CHROME_HOME" PATH="$PATH" DISPLAY=:99 google-chrome --disable-dev-shm-usage --no-first-run --window-size=1280,800 --proxy-server=http://127.0.0.1:9224 --proxy-bypass-list='<-loopback>' --disable-quic --disable-webrtc --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --user-data-dir="$CHROME_HOME" about:blank > "$RUNNER_TEMP/pro-tour-chrome.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9223/json/version > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9223/json/version > /dev/null
          env -i HOME="$HOME" PATH="$PATH" BU_CDP_URL=http://127.0.0.1:9223 .venv/bin/python -c 'from browser_harness.admin import ensure_daemon; ensure_daemon(wait=20)'
      - name: Install Cursor CLI for trusted planning
        if: steps.classify.outputs.run == 'true'
        run: |
          curl --fail --location --silent --show-error https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cursor-agent" --version
      - name: Plan full and focused tours with Grok 4.7
        if: steps.classify.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/plan-tours.js tour-profile.json "$PR_TITLE" > "$RUNNER_TEMP/pro-tour-plan.json"
      - name: Record two Jev tours
        if: steps.classify.outputs.run == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BU_CDP_URL: http://127.0.0.1:9223
          DISPLAY: :99
          APP_URL: ${{ steps.app.outputs.url }}
        run: |
          jq '.full' "$RUNNER_TEMP/pro-tour-plan.json" > "$RUNNER_TEMP/full-goals.json"
          jq '.focused' "$RUNNER_TEMP/pro-tour-plan.json" > "$RUNNER_TEMP/focused-goals.json"
          jq '.textValues' tour-profile.json > "$RUNNER_TEMP/text-values.json"
          .venv/bin/python scripts/run-jev-tour.py --url "$APP_URL" --goals "$RUNNER_TEMP/full-goals.json" --values "$RUNNER_TEMP/text-values.json" --output "$RUNNER_TEMP/full.mp4"
          .venv/bin/python scripts/run-jev-tour.py --url "$APP_URL" --goals "$RUNNER_TEMP/focused-goals.json" --values "$RUNNER_TEMP/text-values.json" --output "$RUNNER_TEMP/focused.mp4"
      - name: Install GitHub CLI with media upload support
        if: steps.classify.outputs.run == 'true'
        run: |
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz --output "$RUNNER_TEMP/gh.tar.gz"
          echo '9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  '"$RUNNER_TEMP/gh.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.101.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Upload playable videos to the PR
        if: steps.classify.outputs.run == 'true'
        env:
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/upload-tours.js "$REPOSITORY" "$PR_NUMBER" "$RUNNER_TEMP/full.mp4" "$RUNNER_TEMP/focused.mp4"
      - name: Stop PR app
        if: always() && steps.app.outputs.container_id != ''
        env:
          CONTAINER_ID: ${{ steps.app.outputs.container_id }}
        run: docker rm -f "$CONTAINER_ID"
