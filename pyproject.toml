[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-tour-local"
version = "0.3.0"
description = "Local feature walkthroughs planned by Codex, driven by Jev, and recorded to MP4"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["licenses/*.txt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "browser-harness",
  "httpx[http2]",
]

[project.scripts]
pro-tour = "pro_tour.cli:main"

[tool.setuptools.packages.find]
where = ["local"]

[tool.setuptools.package-data]
"pro_tour._vendor.jev_ultrafast" = ["*.js"]
